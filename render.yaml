# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: stayly-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    numInstances: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: DATABASE_URL
        fromDatabase:
          name: stayly-database
          property: connectionString
      - key: ALLOWED_ORIGINS
        fromService:
          type: web
          name: stayly-web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
    buildFilter:
      paths:
        - backend/**
        - render.yaml
      ignoredPaths:
        - frontend/**
        - README.md

  - type: web
    name: stayly-web
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.20.0
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: stayly-api
          envVarKey: RENDER_EXTERNAL_HOSTNAME
    buildFilter:
      paths:
        - frontend/**
        - render.yaml
      ignoredPaths:
        - backend/**
        - README.md

databases:
  - name: stayly-database
    plan: free
    databaseName: stayly
    user: stayly
